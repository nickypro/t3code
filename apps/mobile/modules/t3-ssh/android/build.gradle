apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'com.t3tools.ssh'
version = '0.0.0'

android {
  namespace 'expo.modules.t3ssh'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    consumerProguardFiles 'proguard-rules.pro'
  }
  packaging {
    resources {
      // BouncyCastle's multi-release jars each carry the same OSGi manifest.
      excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
    }
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // sshj with the BouncyCastle versions Amaze File Manager ships alongside it.
  implementation 'com.hierynomus:sshj:0.40.0'
  implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
  implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
  testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
  // The end-to-end test runs only when given the scripts and archive to use.
  ['T3_SSH_E2E_SCRIPTS', 'T3_SSH_E2E_HOME'].each { name ->
    def value = System.getenv(name)
    if (value != null) environment name, value
  }
  testLogging {
    events 'passed', 'skipped', 'failed'
    exceptionFormat 'full'
  }
}
